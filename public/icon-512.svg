<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1518" />
      <stop offset="100%" stop-color="#04080a" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Pitch Outer Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="16 12" opacity="0.3" />

  <!-- Inner Pitch Glow Circle -->
  <circle cx="256" cy="256" r="140" fill="#10b981" fill-opacity="0.1" stroke="url(#emerald)" stroke-width="12" filter="url(#glow)" />

  <!-- Stylized Letter P (PitchPass) -->
  <path d="M 195 145 L 290 145 C 340 145 370 175 370 220 C 370 265 340 295 290 295 L 235 295 L 235 375 L 195 375 Z M 235 185 L 235 255 L 285 255 C 315 255 330 240 330 220 C 330 200 315 185 285 185 Z" fill="#ffffff" />

  <!-- Vibrant Accent Dot (Soccer Ball representation) -->
  <circle cx="345" cy="345" r="28" fill="url(#emerald)" filter="url(#glow)" />
  <circle cx="345" cy="345" r="14" fill="#04080a" />
</svg>
